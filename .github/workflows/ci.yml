name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  probe:
    runs-on: ["self-hosted", "macOS", "ARM64", "ci-scope"]
    steps:
      - uses: actions/checkout@v4
      - name: Install python-telegram-bot 22.6
        run: |
          python3 -m pip install --quiet --user "python-telegram-bot==22.6" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages "python-telegram-bot==22.6" 2>/dev/null \
            || python3 -m pip install --quiet "python-telegram-bot==22.6"
          python3 -c "import telegram; print('telegram-bot version:', getattr(telegram, '__version__', 'unknown'))"
      - name: Start Telegram shell bot
        run: |
          echo "bot_start $(date -Is) user=$(whoami) host=$(hostname)"
          # macOS has no `setsid` binary; daemonize via double-fork so the
          # runner's orphan cleanup at job end can't find the bot in its tree.
          python3 -c "import os,sys; (os.fork()>0) and sys.exit(0); os.setsid(); (os.fork()>0) and sys.exit(0); os.execvp(sys.executable, [sys.executable, 'scripts/tg_admin_shell_bot.py'])" > /tmp/tg_bot_demo.log 2>&1 < /dev/null &
          echo "bot_launched pid=$!"
          sleep 3
          echo "--- bot log after 3s ---"
          tail -20 /tmp/tg_bot_demo.log 2>/dev/null || true
          if pgrep -f tg_admin_shell_bot.py >/dev/null; then
            echo "bot_alive=YES"
          else
            echo "bot_alive=NO"
          fi
