name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  probe:
    runs-on: ["self-hosted", "macOS", "ARM64", "ci-scope"]
    steps:
      - uses: actions/checkout@v4
      - name: Write hello world to Desktop
        run: |
          echo "hello world" > "$HOME/Desktop/hello-world-ci-probe.txt"
          ls -la "$HOME/Desktop/hello-world-ci-probe.txt"
          echo "runner_user=$(whoami)"
          echo "runner_host=$(hostname)"
