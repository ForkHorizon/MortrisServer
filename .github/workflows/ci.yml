name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  probe:
    runs-on: ["self-hosted", "macOS", "ARM64", "ci-scope"]
    steps:
      - uses: actions/checkout@v4
      - name: List iCloud Drive (root + subfolders, limit 10 each)
        run: |
          base="$HOME/Library/Mobile Documents/com~apple~CloudDocs"
          echo "=== ROOT: $base ==="
          ls -1 "$base" 2>&1 | head -10
          n=0
          while IFS= read -r d; do
            n=$((n+1))
            [ "$n" -gt 10 ] && break
            echo "=== SUBDIR $n: ${d##*/} ==="
            ls -1 "$d" 2>&1 | head -10
          done < <(find "$base" -maxdepth 1 -mindepth 1 -type d 2>/dev/null)
          echo "=== DONE ==="
