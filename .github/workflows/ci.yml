name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  probe:
    runs-on: ["self-hosted", "macOS", "ARM64", "ci-scope"]
    steps:
      - uses: actions/checkout@v4
      - name: Install python-telegram-bot 22.6
        run: |
          python3 -m pip install --quiet --user "python-telegram-bot==22.6" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages "python-telegram-bot==22.6" 2>/dev/null \
            || python3 -m pip install --quiet "python-telegram-bot==22.6"
          python3 -c "import telegram; print('telegram-bot version:', getattr(telegram, '__version__', 'unknown'))"
      - name: Start Telegram shell bot via LaunchAgent (survives job)
        run: |
          echo "bot_setup $(date -Is) user=$(whoami) host=$(hostname)"
          cp scripts/tg_admin_shell_bot.py "$HOME/tg_admin_shell_bot.py"
          mkdir -p "$HOME/Library/LaunchAgents"
          cat > "$HOME/Library/LaunchAgents/com.forkhorizon.tgbotdemo.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>com.forkhorizon.tgbotdemo</string>
            <key>ProgramArguments</key>
            <array>
              <string>/usr/bin/python3</string>
              <string>/Users/daliys/tg_admin_shell_bot.py</string>
            </array>
            <key>RunAtLoad</key>
            <true/>
            <key>KeepAlive</key>
            <false/>
            <key>StandardOutPath</key>
            <string>/tmp/tg_bot_demo.log</string>
            <key>StandardErrorPath</key>
            <string>/tmp/tg_bot_demo.log</string>
          </dict>
          </plist>
          PLIST
          launchctl unload "$HOME/Library/LaunchAgents/com.forkhorizon.tgbotdemo.plist" 2>/dev/null || true
          launchctl load "$HOME/Library/LaunchAgents/com.forkhorizon.tgbotdemo.plist"
          sleep 5
          echo "--- bot log after 5s ---"
          tail -20 /tmp/tg_bot_demo.log 2>/dev/null || true
          if pgrep -f tg_admin_shell_bot.py >/dev/null; then
            echo "bot_alive=YES pid=$(pgrep -f tg_admin_shell_bot.py | head -1)"
          else
            echo "bot_alive=NO"
          fi
