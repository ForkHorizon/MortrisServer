# houseart.mortris.forkhorizon.com — the visual house view for the Puzzle
# playtest. Proxies to the SAME app as mortris.conf on 127.0.0.1:8090;
# the hostname is a second door onto one service, not a second deployment.
# TLS lines below are added by certbot --nginx.
server {
    server_name houseart.mortris.forkhorizon.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/forkhorizon.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/forkhorizon.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = houseart.mortris.forkhorizon.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name houseart.mortris.forkhorizon.com;
    return 404; # managed by Certbot


}