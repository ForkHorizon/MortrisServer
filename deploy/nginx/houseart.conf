# /etc/nginx/sites-available/houseart on the production VPS (symlink from
# sites-enabled/). Serves houseart.mortris.forkhorizon.com — the visual
# house view for the Puzzle playtest (docs/puzzle-visual-analytics-plan.md).
#
# This proxies to the SAME app on 127.0.0.1:8090 as mortris.conf. There is
# no second binary, no second port, no second database. The hostname is a
# separate door onto one service, so there is nothing extra to deploy,
# monitor, or back up.
#
# The hostname is presentation only, never authorization. Reaching the app
# through this name grants nothing: session auth, CSRF, and per-project
# access checks are unchanged and unconditional. A user without access to
# puzzle_gravity_test is refused here exactly as anywhere else.
#
# BEFORE THIS FILE WORKS, IN ORDER:
#   1. DNS: an A record for houseart.mortris.forkhorizon.com -> the VPS IP,
#      in Cloudflare, DNS-only (grey cloud) to match mortris and sdk-test,
#      which both resolve straight to the origin.
#   2. TLS: re-run certbot with EVERY hostname on this box in ONE
#      invocation. Passing only the new name silently drops the others
#      from the shared certificate — see deploy/README.md step 13:
#      sudo certbot --nginx --expand \
#        -d forkhorizon.com,www.forkhorizon.com,ci.forkhorizon.com,\
#        housepuzzle.forkhorizon.com,finance.forkhorizon.com,\
#        mortris.forkhorizon.com,sdk-test.mortris.forkhorizon.com,\
#        houseart.mortris.forkhorizon.com
#      certbot --nginx rewrites the listen/ssl_certificate lines below.
#   3. Add the hostname to ForkHorizon's scripts/healthcheck.mjs CHECKS.

server {
    server_name houseart.mortris.forkhorizon.com;

    # Matches mortris.conf. The geometry upload route is the largest body
    # this host accepts, and the server's own limit is 8 MB, deliberately
    # under this ceiling.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkhorizon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkhorizon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = houseart.mortris.forkhorizon.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name houseart.mortris.forkhorizon.com;
    return 404;
}
